version: '3.8'

services:
  # The PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: invex-db
    restart: always
    environment:
      POSTGRES_USER: invex_user
      POSTGRES_PASSWORD: invex_password
      POSTGRES_DB: invex_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invex_user -d invex_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Caching and Task Queue
  redis:
    image: redis:7-alpine
    container_name: invex-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

volumes:
  postgres_data:
  redis_data:
